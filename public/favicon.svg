<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0524" />
      <stop offset="50%" stop-color="#5B0638" />
      <stop offset="100%" stop-color="#2D031C" />
    </linearGradient>
    <linearGradient id="brandPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EC4899" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="white" stroke-opacity="0.08" stroke-width="4" />

  <!-- Outer Elegant Halo -->
  <circle cx="256" cy="256" r="170" stroke="url(#brandPink)" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Center Stylized 'S' Luxury Monogram -->
  <path d="M 330 185 C 330 145 295 120 250 120 C 190 120 160 160 160 195 C 160 250 330 250 330 315 C 330 365 285 392 240 392 C 185 392 155 355 155 315" 
        stroke="url(#brandPink)" stroke-width="36" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Sparkle Accent -->
  <path d="M 360 130 Q 370 145 385 155 Q 370 165 360 180 Q 350 165 335 155 Q 350 145 360 130 Z" fill="#FDF2F8" />
  <circle cx="360" cy="155" r="4" fill="#EC4899" />
</svg>
